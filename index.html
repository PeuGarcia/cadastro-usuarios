<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuários</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    
        <h1>Cadastro de Usuários</h1>

        <!-- Formulário de cadastro -->
        <form id="formCadastro">

            <div class="campo">
                <label for="nome">Nome Completo</label> 
                <input type="text" id="nome" required>
            </div>  
            <div class="campo">
                <label for="email">E-mail</label> 
                <input type="email" id="email" required>
            </div>
            <div class="campo">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" maxlength="14" placeholder="XXX.XXX.XXX-XX" required>
            </div>
            <div class="campo">
                <label for="cep">CEP</label>
                <input type="text" id="cep" maxlength="9" placeholder="XXXXX-XXX" required>
            </div>
            <div class="campo">
                <label for="rua">Rua</label>
                <input type="text" id="rua" required>
            </div>
            <div class="campo">
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" required>
            </div>
            <div class="campo">
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" required>
            </div>
            <div class="campo">
                <label for="estado">Estado</label>
                <input type="text" id="estado" required>
            </div>

            <button type="submit">Cadastrar</button>

        </form>

    <!-- Botão para mostrar/ocultar a lista de usuários -->
    <button id="botaoUsuarios">Ver Usuários Cadastrados
    </button>

    <!-- Container para a lista de usuários -->
    <div id="usuariosContainer">

        <h2>Usuários Cadastrados</h2>

        <div id="listaUsuarios"></div>
        
    </div>

    <script src="script.js"></script>
</body>
</html>
